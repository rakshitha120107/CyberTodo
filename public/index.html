
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber To-Do List</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 { color: #3730a3; }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            padding: 12px;
            background: #4338ca;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn { background: #dc2626; }

        #message { color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Cyber To-Do List</h1>
        <p>Organize your cybersecurity learning tasks.</p>

        <form id="taskForm" class="input-row">
            <input type="text" id="taskInput"
                   placeholder="Enter a task..." required>
            <button type="submit">Add</button>
        </form>

        <p id="message" role="status"></p>
        <ul id="taskList"></ul>
    </div>

    <script>
        const form = document.getElementById("taskForm");
        const input = document.getElementById("taskInput");
        const list = document.getElementById("taskList");
        const message = document.getElementById("message");

        async function loadTasks() {
            try {
                const response = await fetch("/tasks");
                if (!response.ok) throw new Error();

                const tasks = await response.json();
                list.replaceChildren();

                tasks.forEach(task => {
                    const li = document.createElement("li");

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.checked = task.completed;
                    checkbox.addEventListener("change", async () => {
                        try {
                            const response = await fetch(
                                `/tasks/${task.id}`,
                                { method: "PUT" }
                            );
                            if (!response.ok) throw new Error();
                            await loadTasks();
                        } catch {
                            message.textContent = "Could not update task.";
                            await loadTasks();
                        }
                    });

                    const title = document.createElement("span");
                    title.textContent = task.title;
                    if (task.completed) {
                        title.classList.add("completed");
                    }

                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Delete";
                    deleteBtn.className = "delete-btn";
                    deleteBtn.addEventListener("click", async () => {
                        try {
                            const response = await fetch(
                                `/tasks/${task.id}`,
                                { method: "DELETE" }
                            );
                            if (!response.ok) throw new Error();
                            await loadTasks();
                        } catch {
                            message.textContent = "Could not delete task.";
                        }
                    });

                    li.append(checkbox, title, deleteBtn);
                    list.appendChild(li);
                });
            } catch {
                message.textContent = "Could not load tasks.";
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const title = input.value.trim();
            if (!title) return;

            try {
                const response = await fetch("/tasks", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ title })
                });

                if (!response.ok) throw new Error();

                input.value = "";
                message.textContent = "Task added successfully!";
                await loadTasks();
            } catch {
                message.textContent = "Could not add task.";
            }
        });

        loadTasks();
    </script>
</body>
</html>
